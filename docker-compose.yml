# All values come from .env (copy .env.sample to .env); the defaults after ":-" apply when unset.
services:
  cctv:
    build: .
    container_name: ${CONTAINER_NAME:-cctv-mini}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${APP_PORT:-8003}:8000"
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - SCAN_SUBNET=${SCAN_SUBNET:-192.168.1.0/24}
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${PICTURES_PATH:-./data/cctv}:/data/cctv
      - ${TIMELAPSE_PATH:-./data/timelapse}:/data/timelapse
